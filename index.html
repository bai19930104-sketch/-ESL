<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 KidsParadise 小學館全美語 ESL</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        select, button, input {
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .tab-content.active {
            display: block;
        }

        /* 學習卡片樣式 */
        .single-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .word-title {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }

        .pos {
            font-size: 16px;
            color: #7f8c8d;
            font-style: italic;
        }

        .chinese-block {
            font-size: 24px;
            color: #e67e22;
            font-weight: bold;
        }

        .section-box {
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .section-content {
            font-size: 16px;
            color: #444;
        }

        .audio-btn {
            background: none;
            color: var(--primary-color);
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .audio-btn:hover {
            color: var(--secondary-color);
        }

        .card-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .page-indicator {
            font-size: 16px;
            color: #666;
            font-weight: bold;
        }

        /* 通用測驗與練習面板 */
        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .quiz-opt-btn {
            padding: 15px;
            font-size: 16px;
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .quiz-opt-btn:hover {
            background-color: #e2e6ea;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .input-group input {
            flex: 1;
            max-width: 300px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 KidsParadise 小學館全美語 ESL</h1>
    </header>

    <div class="controls">
        <div>
            <label for="groupSelect">選擇年級：</label>
            <select id="groupSelect" onchange="changeGroup()"></select>
        </div>
        <div>
            <label for="voiceSelect">語音發音：</label>
            <select id="voiceSelect"></select>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('learn')">📖 學習</button>
        <button class="nav-btn" onclick="switchTab('quiz')">🧩 選擇題測驗</button>
        <button class="nav-btn" onclick="switchTab('sentenceQuiz')">✏️ 句型挖空選擇</button>
        <button class="nav-btn" onclick="switchTab('dictation')">🎧 聽寫測驗</button>
        <button class="nav-btn" onclick="switchTab('spelling')">✍️ 拼字練習</button>
    </div>

    <!-- 學習分頁 -->
    <div id="learnTab" class="tab-content active">
        <div id="singleCardContainer" class="single-card"></div>
        <div class="card-navigation">
            <button onclick="prevCard()">⬅️ 上一個</button>
            <span id="pageIndicator" class="page-indicator">1 / 1</span>
            <button onclick="nextCard()">下一個 ➡️</button>
        </div>
    </div>

    <!-- 選擇題測驗分頁 -->
    <div id="quizTab" class="tab-content">
        <div class="quiz-card">
            <h2 id="quizQuestion">---</h2>
            <div id="quizOptions" class="quiz-options"></div>
            <p id="quizFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initQuiz()" style="margin-top: 15px;">下一題</button>
        </div>
    </div>

    <!-- 句型挖空選擇題分頁 -->
    <div id="sentenceQuizTab" class="tab-content">
        <div class="quiz-card">
            <h3 style="color: #666; margin-bottom: 10px;">請根據例句選出正確填空：</h3>
            <div id="sentenceQuestion" style="font-size: 20px; font-weight: bold; color: #2c3e50; margin: 20px 0; line-height: 1.5;">---</div>
            <p id="sentenceChineseHint" style="color: #e67e22; font-size: 16px; font-style: italic;"></p>
            <div id="sentenceOptions" class="quiz-options"></div>
            <p id="sentenceFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initSentenceQuiz()" style="margin-top: 15px;">下一題</button>
        </div>
    </div>

    <!-- 聽寫測驗分頁 -->
    <div id="dictationTab" class="tab-content">
        <div class="quiz-card">
            <h2>聽發音寫出單字</h2>
            <button onclick="playDictationAudio()" style="font-size: 24px; padding: 15px 25px; margin: 15px 0;">🔊 點擊播放發音</button>
            <p id="dictationHint" style="color: #666; font-style: italic;"></p>
            <div class="input-group">
                <input type="text" id="dictationInput" placeholder="請輸入聽到的英文單字..." onkeydown="if(event.key==='Enter') checkDictation()">
                <button onclick="checkDictation()">提交答案</button>
            </div>
            <p id="dictationFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initDictation()" style="margin-top: 15px; background-color: #7f8c8d;">下一題</button>
        </div>
    </div>

    <!-- 拼字練習分頁 -->
    <div id="spellingTab" class="tab-content">
        <div class="quiz-card">
            <h2>看中文提示拼出單字</h2>
            <div id="spellingChinese" style="font-size: 26px; color: #e67e22; font-weight: bold; margin: 15px 0;">---</div>
            <p id="spellingPos" style="color: #7f8c8d; font-style: italic;"></p>
            <div class="input-group">
                <input type="text" id="spellingInput" placeholder="請輸入英文單字..." onkeydown="if(event.key==='Enter') checkSpelling()">
                <button onclick="checkSpelling()">提交拼字</button>
            </div>
            <p id="spellingFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="initSpelling()" style="margin-top: 15px; background-color: #7f8c8d;">下一題</button>
        </div>
    </div>

<script>
const defaultData = [

  { "word": "strengthen", "pos": "v.", "group": "ESL 6A", "chinese": "強化 / 加強", "defEn": "to make someone or something stronger", "example": "Regular exercise can strengthen your muscles." },

let wordDatabase = [];
let filteredData = [];
let currentIndex = 0;
let currentQuizAnswer = '';
let currentSentenceItem = null;
let currentSentenceAnswer = '';
let currentDictationItem = null;
let currentSpellingItem = null;
let availableVoices = [];

function isMobileDevice() {
    return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
}

function populateVoiceList() {
    if (typeof speechSynthesis === 'undefined') return;
    const synth = speechSynthesis;
    const allVoices = synth.getVoices();
    const voiceSelect = document.getElementById('voiceSelect');
    
    let filtered = [];
    const mobile = isMobileDevice();

    if (mobile) {
        filtered = allVoices.filter(voice => {
            const name = voice.name.toLowerCase();
            return name.includes('samantha');
        });

        if (filtered.length === 0) {
            filtered = allVoices.filter(voice => voice.lang.toLowerCase().includes('en') && !voice.name.toLowerCase().includes('male'));
        }
    } else {
        filtered = allVoices.filter(voice => {
            const name = voice.name.toLowerCase();
            const lang = voice.lang.toLowerCase();
            const isEnglish = lang.includes('en');
            const isGoogle = name.includes('google');
            const isNotMale = !name.includes('male') && !name.includes('david') && !name.includes('mark');
            return isEnglish && isGoogle && isNotMale;
        });

        if (filtered.length === 0) {
            filtered = allVoices.filter(voice => {
                const name = voice.name.toLowerCase();
                const lang = voice.lang.toLowerCase();
                return lang.includes('en') && !name.includes('male');
            });
        }
    }

    availableVoices = filtered;

    voiceSelect.innerHTML = '';
    availableVoices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
    });

    if (voiceSelect.options.length > 0) {
        voiceSelect.selectedIndex = 0;
    }
}

populateVoiceList();
if (typeof speechSynthesis !== 'undefined') {
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }
}

function speak(text) {
    if (typeof speechSynthesis === 'undefined') return;
    
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    const voiceSelect = document.getElementById('voiceSelect');
    const selectedIndex = voiceSelect.value;
    
    if (availableVoices.length > 0 && availableVoices[selectedIndex]) {
        utterance.voice = availableVoices[selectedIndex];
    }

    utterance.rate = 0.7;
    utterance.pitch = 1.0;

    setTimeout(() => {
        speechSynthesis.speak(utterance);
    }, 50);
}

function loadDatabase() {
    wordDatabase = defaultData;
    localStorage.setItem('esl_word_db', JSON.stringify(wordDatabase));
}

function switchTab(tabName) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if (tabName === 'learn') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('learnTab').classList.add('active');
    } else if (tabName === 'quiz') {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('quizTab').classList.add('active');
        initQuiz();
    } else if (tabName === 'sentenceQuiz') {
        document.querySelectorAll('.nav-btn')[2].classList.add('active');
        document.getElementById('sentenceQuizTab').classList.add('active');
        initSentenceQuiz();
    } else if (tabName === 'dictation') {
        document.querySelectorAll('.nav-btn')[3].classList.add('active');
        document.getElementById('dictationTab').classList.add('active');
        initDictation();
    } else if (tabName === 'spelling') {
        document.querySelectorAll('.nav-btn')[4].classList.add('active');
        document.getElementById('spellingTab').classList.add('active');
        initSpelling();
    }
}

function populateGroupFilter() {
    const select = document.getElementById('groupSelect');
    const groups = [...new Set(wordDatabase.map(item => item.group))].sort();
    select.innerHTML = '<option value="ALL">全部年級</option>';
    groups.forEach(group => {
        const opt = document.createElement('option');
        opt.value = group;
        opt.textContent = group;
        select.appendChild(opt);
    });
}

function changeGroup() {
    currentIndex = 0;
    updateFilteredData();
    renderSingleCard();
}

function updateFilteredData() {
    const selectedGroup = document.getElementById('groupSelect').value;
    filteredData = selectedGroup === 'ALL' 
        ? wordDatabase 
        : wordDatabase.filter(item => item.group === selectedGroup);
}

function renderSingleCard() {
    const container = document.getElementById('singleCardContainer');
    const indicator = document.getElementById('pageIndicator');
    
    if (filteredData.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px;">此年級目前沒有單字資料</div>';
        indicator.textContent = '0 / 0';
        return;
    }

    if (currentIndex >= filteredData.length) currentIndex = 0;
    if (currentIndex < 0) currentIndex = filteredData.length - 1;

    const item = filteredData[currentIndex];
    indicator.textContent = `${currentIndex + 1} / ${filteredData.length}`;

    container.innerHTML = `
        <div class="card-header-flex">
            <div>
                <div class="word-title">${item.word}</div>
                <div class="pos">${item.pos || ''} &bull; <span style="color:var(--primary-color);">${item.group}</span></div>
            </div>
            <button class="audio-btn" onclick="speak('${item.word.replace(/'/g, "\\'")}')" title="讀出單字">🔊 發音</button>
        </div>
        <div class="chinese-block">${item.chinese}</div>
        <div>
            <div class="section-label">英文解釋 (Definition)</div>
            <div class="section-box">
                <div class="section-content">${item.defEn || ''}</div>
                <button class="audio-btn" onclick="speak('${(item.defEn || '').replace(/'/g, "\\'")}')" title="讀出解釋">🔊</button>
            </div>
        </div>
        <div>
            <div class="section-label">例句 (Example)</div>
            <div class="section-box" style="border-left: 4px solid var(--primary-color);">
                <div class="section-content" style="font-style: italic;">${item.example || ''}</div>
                <button class="audio-btn" onclick="speak('${(item.example || '').replace(/'/g, "\\'")}')" title="讀出例句">🔊</button>
            </div>
        </div>
    `;
}

function nextCard() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex + 1) % filteredData.length;
    renderSingleCard();
}

function prevCard() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
    renderSingleCard();
}

function initQuiz() {
    document.getElementById('quizFeedback').textContent = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    if (pool.length === 0) return;

    const current = pool[Math.floor(Math.random() * pool.length)];
    currentQuizAnswer = current.chinese;
    document.getElementById('quizQuestion').textContent = current.word;

    let options = [current.chinese];
    while (options.length < 4 && options.length < wordDatabase.length) {
        const randomItem = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
        if (!options.includes(randomItem.chinese)) options.push(randomItem.chinese);
    }
    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = opt;
        btn.onclick = () => {
            const feedback = document.getElementById('quizFeedback');
            if (opt === currentQuizAnswer) {
                feedback.textContent = '🎉 正確！非常棒！';
                feedback.style.color = 'var(--success-color)';
            } else {
                feedback.textContent = `❌ 答錯囉！正確答案是：${currentQuizAnswer}`;
                feedback.style.color = 'var(--danger-color)';
            }
        };
        optionsContainer.appendChild(btn);
    });
}

function initSentenceQuiz() {
    document.getElementById('sentenceFeedback').textContent = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    const validPool = pool.filter(item => item.example && item.example.includes(item.word));
    const finalPool = validPool.length > 0 ? validPool : pool;
    if (finalPool.length === 0) return;

    currentSentenceItem = finalPool[Math.floor(Math.random() * finalPool.length)];
    currentSentenceAnswer = currentSentenceItem.word;

    let maskedExample = currentSentenceItem.example;
    const regex = new RegExp(currentSentenceItem.word, 'gi');
    maskedExample = maskedExample.replace(regex, '______');

    document.getElementById('sentenceQuestion').innerHTML = maskedExample;
    document.getElementById('sentenceChineseHint').textContent = `💡 中文提示：${currentSentenceItem.chinese}`;

    let options = [currentSentenceItem.word];
    while (options.length < 4 && options.length < wordDatabase.length) {
        const randomItem = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
        if (!options.includes(randomItem.word)) options.push(randomItem.word);
    }
    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('sentenceOptions');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = opt;
        btn.onclick = () => {
            const feedback = document.getElementById('sentenceFeedback');
            if (opt.toLowerCase() === currentSentenceAnswer.toLowerCase()) {
                feedback.textContent = '🎉 答對了！填空正確！';
                feedback.style.color = 'var(--success-color)';
                speak(currentSentenceItem.example);
            } else {
                feedback.textContent = `❌ 答錯囉！正確答案是：${currentSentenceAnswer}`;
                feedback.style.color = 'var(--danger-color)';
            }
        };
        optionsContainer.appendChild(btn);
    });
}

function initDictation() {
    document.getElementById('dictationFeedback').textContent = '';
    document.getElementById('dictationInput').value = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    if (pool.length === 0) return;

    currentDictationItem = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('dictationHint').textContent = `提示：中文意思是「${currentDictationItem.chinese}」(${currentDictationItem.pos || ''})`;
    playDictationAudio();
}

function playDictationAudio() {
    if (currentDictationItem) {
        speak(currentDictationItem.word);
    }
}

function checkDictation() {
    if (!currentDictationItem) return;
    const userVal = document.getElementById('dictationInput').value.trim().toLowerCase();
    const correctVal = currentDictationItem.word.toLowerCase();
    const feedback = document.getElementById('dictationFeedback');

    if (userVal === correctVal) {
        feedback.textContent = '🎉 拼寫正確！太棒了！';
        feedback.style.color = 'var(--success-color)';
    } else {
        feedback.textContent = `❌ 拼寫錯誤！正確單字是：${currentDictationItem.word}`;
        feedback.style.color = 'var(--danger-color)';
    }
}

function initSpelling() {
    document.getElementById('spellingFeedback').textContent = '';
    document.getElementById('spellingInput').value = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;
    if (pool.length === 0) return;

    currentSpellingItem = pool[Math.floor(Math.random() * pool.length)];
    document.getElementById('spellingChinese').textContent = currentSpellingItem.chinese;
    document.getElementById('spellingPos').textContent = `詞性：${currentSpellingItem.pos || '未分類'} | 英文解釋：${currentSpellingItem.defEn || ''}`;
}

function checkSpelling() {
    if (!currentSpellingItem) return;
    const userVal = document.getElementById('spellingInput').value.trim().toLowerCase();
    const correctVal = currentSpellingItem.word.toLowerCase();
    const feedback = document.getElementById('spellingFeedback');

    if (userVal === correctVal) {
        feedback.textContent = '🎉 拼字完全正確！';
        feedback.style.color = 'var(--success-color)';
        speak(currentSpellingItem.word);
    } else {
        feedback.textContent = `❌ 答錯囉！正確拼字是：${currentSpellingItem.word}`;
        feedback.style.color = 'var(--danger-color)';
    }
}

function initApp() {
    loadDatabase();
    populateGroupFilter();
    updateFilteredData();
    renderSingleCard();
    
    document.body.addEventListener('touchstart', function() {
        if (typeof speechSynthesis !== 'undefined' && speechSynthesis.speaking === false) {
            const silentUtter = new SpeechSynthesisUtterance('');
            silentUtter.volume = 0;
            speechSynthesis.speak(silentUtter);
        }
    }, { once: true });
}

window.onload = initApp;
</script>
