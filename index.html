<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 小學館全美語 ESL</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        select, button, textarea {
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 800px;
        }

        .tab-content.active {
            display: block;
        }

        /* 學習卡片樣式 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .word-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pos {
            font-size: 14px;
            color: #7f8c8d;
            font-style: italic;
        }

        .chinese {
            font-size: 18px;
            color: #e67e22;
            margin: 8px 0;
        }

        .def-en {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .example {
            font-size: 13px;
            color: #777;
            background: #f9f9f9;
            padding: 6px;
            border-left: 3px solid var(--primary-color);
            border-radius: 0 4px 4px 0;
        }

        .audio-btn {
            background: none;
            color: var(--primary-color);
            border: none;
            font-size: 18px;
            padding: 0 5px;
        }

        .audio-btn:hover {
            background: none;
            color: var(--secondary-color);
        }

        /* 測驗樣式 */
        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .quiz-opt-btn {
            padding: 15px;
            font-size: 16px;
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .quiz-opt-btn:hover {
            background-color: #e2e6ea;
        }

        .setting-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 300px;
            box-sizing: border-box;
            font-family: monospace;
        }
    </style>
</head>

        <h1>🌸 小學館全美語 ESL</h1>
    </header>

            <select id="groupSelect" onchange="filterData()"></select>
        </div>
        <div>
            <label for="voiceSelect">語音發音：</label>
            <select id="voiceSelect"></select>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('learn')">📖 學習</button>
