<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 小學館全美語 ESL</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        select, button {
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 600px;
        }

        .tab-content.active {
            display: block;
        }

        /* 單張翻頁卡片樣式 */
        .single-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
            position: relative;
        }

        .card-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .word-title {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }

        .pos {
            font-size: 16px;
            color: #7f8c8d;
            font-style: italic;
        }

        .chinese-block {
            font-size: 24px;
            color: #e67e22;
            font-weight: bold;
        }

        .section-box {
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .section-content {
            font-size: 16px;
            color: #444;
        }

        .audio-btn {
            background: none;
            color: var(--primary-color);
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
        }

        .audio-btn:hover {
            color: var(--secondary-color);
        }

        .card-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .page-indicator {
            font-size: 16px;
            color: #666;
            font-weight: bold;
        }

        /* 測驗樣式 */
        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .quiz-opt-btn {
            padding: 15px;
            font-size: 16px;
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .quiz-opt-btn:hover {
            background-color: #e2e6ea;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 小學館全美語 ESL</h1>
    </header>

    <div class="controls">
        <div>
            <label for="groupSelect">選擇年級：</label>
            <select id="groupSelect" onchange="changeGroup()"></select>
        </div>
        <div>
            <label for="voiceSelect">語音發音：</label>
            <select id="voiceSelect"></select>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('learn')">📖 學習</button>
        <button class="nav-btn" onclick="switchTab('quiz')">🧩 測驗</button>
    </div>

    <!-- 學習分頁 (單字一頁) -->
    <div id="learnTab" class="tab-content active">
        <div id="singleCardContainer" class="single-card"></div>
        <div class="card-navigation">
            <button onclick="prevCard()">⬅️ 上一個</button>
            <span id="pageIndicator" class="page-indicator">1 / 1</span>
            <button onclick="nextCard()">下一個 ➡️</button>
        </div>
    </div>

    <!-- 測驗分頁 -->
    <div id="quizTab" class="tab-content">
        <div class="quiz-card">
            <h2 id="quizQuestion">---</h2>
            <div id="quizOptions" class="quiz-options"></div>
            <p id="quizFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="nextQuiz()" style="margin-top: 15px;">下一題</button>
        </div>
    </div>

<script>
const defaultData = [
  { "word": "new", "pos": "adj.", "group": "ESL 1A", "chinese": "新的", "defEn": "not old; made or bought a short time ago", "example": "I have a new bag." },
  { "word": "old", "pos": "adj.", "group": "ESL 1A", "chinese": "舊的 / 老的", "defEn": "not new; having been here for a long time", "example": "This is my old bike." },
  { "word": "play basketball", "pos": "v. phr.", "group": "ESL 1A", "chinese": "打籃球", "defEn": "to play a game with a ball and a basket", "example": "I play basketball with my friends." },
  { "word": "whose", "pos": "pron.", "group": "ESL 2A", "chinese": "誰的", "defEn": "used to ask who something belongs to", "example": "Whose bag is this?" },
  { "word": "hotel", "pos": "n.", "group": "ESL 2A", "chinese": "飯店旅館", "defEn": "a place where people can stay when they are away from home", "example": "We stay at a hotel." },
  { "word": "Spanish", "pos": "adj.", "group": "ESL 3A", "chinese": "西班牙文 / 西班牙人的", "defEn": "from Spain, or the language spoken in Spain", "example": "My new classmate is Spanish." },
  { "word": "important", "pos": "adj.", "group": "ESL 3A", "chinese": "重要的", "defEn": "you need to think about or do carefully", "example": "It is important to check your bag." },
  { "word": "land", "pos": "n.", "group": "ESL 4A", "chinese": "陸地 / 降落", "defEn": "the ground, not the sea; to come down to the ground", "example": "The plane landed safely." },
  { "word": "Europe", "pos": "n.", "group": "ESL 4A", "chinese": "歐洲", "defEn": "a continent that includes countries such as France and Spain", "example": "We want to travel to Europe." },
  { "word": "handsome", "pos": "adj.", "group": "ESL 5A", "chinese": "英俊的", "defEn": "good-looking, especially used to describe a man or boy", "example": "The handsome actor smiled at the children." },
  { "word": "already", "pos": "adv.", "group": "ESL 5A", "chinese": "已經", "defEn": "before now, or sooner than expected", "example": "I have already finished my science project." },
  { "word": "fashion", "pos": "n.", "group": "ESL 6A", "chinese": "時尚", "defEn": "a popular style of clothes, hair, or appearance", "example": "Fashion changes over time." },
  { "word": "button", "pos": "n.", "group": "ESL 6A", "chinese": "鈕扣 / 按鈕", "defEn": "a small round object on clothes used to fasten them", "example": "Press the green button on the machine." }
];

let wordDatabase = [];
let filteredData = [];
let currentIndex = 0;
let currentQuizAnswer = '';

function populateVoiceList() {
    if (typeof speechSynthesis === 'undefined') return;
    const voices = speechSynthesis.getVoices();
    const voiceSelect = document.getElementById('voiceSelect');
    voiceSelect.innerHTML = '';
    
    voices.forEach((voice) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-lang', voice.lang);
        option.setAttribute('data-name', voice.name);
        if (voice.lang.includes('en')) option.selected = true;
        voiceSelect.appendChild(option);
    });
}

populateVoiceList();
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoiceList;
}

function speak(text) {
    if (typeof speechSynthesis === 'undefined') return;
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const voiceSelect = document.getElementById('voiceSelect');
    const selectedOption = voiceSelect.selectedOptions[0];
    if (selectedOption) {
        const voices = speechSynthesis.getVoices();
        utterance.voice = voices.find(v => v.name === selectedOption.getAttribute('data-name'));
    }
    speechSynthesis.speak(utterance);
}

function loadDatabase() {
    wordDatabase = defaultData;
    localStorage.setItem('esl_word_db', JSON.stringify(wordDatabase));
}

function switchTab(tabName) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if (tabName === 'learn') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('learnTab').classList.add('active');
    } else if (tabName === 'quiz') {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('quizTab').classList.add('active');
        initQuiz();
    }
}

function populateGroupFilter() {
    const select = document.getElementById('groupSelect');
    const groups = [...new Set(wordDatabase.map(item => item.group))].sort();
    select.innerHTML = '<option value="ALL">全部年級</option>';
    groups.forEach(group => {
        const opt = document.createElement('option');
        opt.value = group;
        opt.textContent = group;
        select.appendChild(opt);
    });
}

function changeGroup() {
    currentIndex = 0;
    updateFilteredData();
    renderSingleCard();
}

function updateFilteredData() {
    const selectedGroup = document.getElementById('groupSelect').value;
    filteredData = selectedGroup === 'ALL' 
        ? wordDatabase 
        : wordDatabase.filter(item => item.group === selectedGroup);
}

// 渲染單字一頁
function renderSingleCard() {
    const container = document.getElementById('singleCardContainer');
    const indicator = document.getElementById('pageIndicator');
    
    if (filteredData.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:20px;">此年級目前沒有單字資料</div>';
        indicator.textContent = '0 / 0';
        return;
    }

    if (currentIndex >= filteredData.length) currentIndex = 0;
    if (currentIndex < 0) currentIndex = filteredData.length - 1;

    const item = filteredData[currentIndex];
    indicator.textContent = `${currentIndex + 1} / ${filteredData.length}`;

    container.innerHTML = `
        <div class="card-header-flex">
            <div>
                <div class="word-title">${item.word}</div>
                <div class="pos">${item.pos || ''} &bull; <span style="color:var(--primary-color);">${item.group}</span></div>
            </div>
            <button class="audio-btn" onclick="speak('${item.word.replace(/'/g, "\\'")}')" title="讀出單字">🔊 發音</button>
        </div>

        <div class="chinese-block">
            ${item.chinese}
        </div>

        <div>
            <div class="section-label">英文解釋 (Definition)</div>
            <div class="section-box">
                <div class="section-content">${item.defEn || ''}</div>
                <button class="audio-btn" onclick="speak('${(item.defEn || '').replace(/'/g, "\\'")}')" title="讀出解釋">🔊</button>
            </div>
        </div>

        <div>
            <div class="section-label">例句 (Example)</div>
            <div class="section-box" style="border-left: 4px solid var(--primary-color);">
                <div class="section-content" style="font-style: italic;">${item.example || ''}</div>
                <button class="audio-btn" onclick="speak('${(item.example || '').replace(/'/g, "\\'")}')" title="讀出例句">🔊</button>
            </div>
        </div>
    `;
}

function nextCard() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex + 1) % filteredData.length;
    renderSingleCard();
}

function prevCard() {
    if (filteredData.length === 0) return;
    currentIndex = (currentIndex - 1 + filteredData.length) % filteredData.length;
    renderSingleCard();
}

// 測驗功能
function initQuiz() {
    nextQuiz();
}

function nextQuiz() {
    document.getElementById('quizFeedback').textContent = '';
    const pool = filteredData.length > 0 ? filteredData : wordDatabase;

    if (pool.length === 0) {
        document.getElementById('quizQuestion').textContent = '尚無測驗資料';
        document.getElementById('quizOptions').innerHTML = '';
        return;
    }

    const current = pool[Math.floor(Math.random() * pool.length)];
    currentQuizAnswer = current.chinese;
    document.getElementById('quizQuestion').textContent = current.word;

    let options = [current.chinese];
    while (options.length < 4 && options.length < wordDatabase.length) {
        const randomItem = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
        if (!options.includes(randomItem.chinese)) {
            options.push(randomItem.chinese);
        }
    }
    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = opt;
        btn.onclick = () => checkQuiz(opt);
        optionsContainer.appendChild(btn);
    });
}

function checkQuiz(selected) {
    const feedback = document.getElementById('quizFeedback');
    if (selected === currentQuizAnswer) {
        feedback.textContent = '🎉 正確！非常棒！';
        feedback.style.color = 'green';
    } else {
        feedback.textContent = `❌ 答錯囉！正確答案是：${currentQuizAnswer}`;
        feedback.style.color = 'red';
    }
}

function initApp() {
    loadDatabase();
    populateGroupFilter();
    updateFilteredData();
    renderSingleCard();
}

window.onload = initApp;
</script>
</body>
</html>
