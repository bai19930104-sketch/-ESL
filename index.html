<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 小學館全美語 ESL</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5a623;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        select, button, textarea {
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background-color: #e0e0e0;
            color: #333;
        }

        .nav-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-content {
            display: none;
            width: 100%;
            max-width: 800px;
        }

        .tab-content.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .word-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pos {
            font-size: 14px;
            color: #7f8c8d;
            font-style: italic;
        }

        .chinese {
            font-size: 18px;
            color: #e67e22;
            margin: 8px 0;
        }

        .def-en {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .example {
            font-size: 13px;
            color: #777;
            background: #f9f9f9;
            padding: 6px;
            border-left: 3px solid var(--primary-color);
            border-radius: 0 4px 4px 0;
        }

        .audio-btn {
            background: none;
            color: var(--primary-color);
            border: none;
            font-size: 18px;
            padding: 0 5px;
        }

        .audio-btn:hover {
            background: none;
            color: var(--secondary-color);
        }

        .quiz-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .quiz-opt-btn {
            padding: 15px;
            font-size: 16px;
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #e9ecef;
        }

        .quiz-opt-btn:hover {
            background-color: #e2e6ea;
        }

        .setting-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        textarea {
            width: 100%;
            height: 300px;
            box-sizing: border-box;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌸 小學館全美語 ESL</h1>
    </header>

    <div class="controls">
        <div>
            <label for="groupSelect">選擇包裹：</label>
            <select id="groupSelect" onchange="filterData()"></select>
        </div>
        <div>
            <label for="voiceSelect">語音發音：</label>
            <select id="voiceSelect"></select>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('learn')">📖 學習</button>
        <button class="nav-btn" onclick="switchTab('quiz')">🧩 測驗</button>
        <!-- ⚙️ 設定頁面已隱藏 -->
    </div>

    <!-- 學習分頁 -->
    <div id="learnTab" class="tab-content active">
        <div id="cardGrid" class="grid-container"></div>
    </div>

    <!-- 測驗分頁 -->
    <div id="quizTab" class="tab-content">
        <div class="quiz-card">
            <h2 id="quizQuestion">---</h2>
            <div id="quizOptions" class="quiz-options"></div>
            <p id="quizFeedback" style="margin-top: 15px; font-weight: bold;"></p>
            <button onclick="nextQuiz()" style="margin-top: 15px;">下一題</button>
        </div>
    </div>

    <!-- 設定分頁 (隱藏) -->
    <div id="settingsTab" class="tab-content">
        <div class="setting-box">
            <h3>JSON 單字庫數據編輯：</h3>
            <textarea id="jsonInput"></textarea>
            <br><br>
            <button onclick="saveDatabase()">💾 儲存並更新數據</button>
        </div>
    </div>

<script>
// 內建完整 ESL 1A ~ 6A 單字資料
const defaultData = [
  { "word": "new", "pos": "adj.", "group": "ESL 1A", "chinese": "新的", "defEn": "not old; made or bought a short time ago", "example": "I have a new bag." },
  { "word": "old", "pos": "adj.", "group": "ESL 1A", "chinese": "舊的 / 老的", "defEn": "not new; having been here for a long time", "example": "This is my old bike." },
  { "word": "play basketball", "pos": "v. phr.", "group": "ESL 1A", "chinese": "打籃球", "defEn": "to play a game with a ball and a basket", "example": "I play basketball with my friends." },
  { "word": "play football", "pos": "v. phr.", "group": "ESL 1A", "chinese": "踢美式足球", "defEn": "to play a game with a ball and two teams", "example": "We play football at school." },
  { "word": "play soccer", "pos": "v. phr.", "group": "ESL 1A", "chinese": "踢足球", "defEn": "to play a game where you kick a ball", "example": "They play soccer in the park." },
  { "word": "teacher", "pos": "n.", "group": "ESL 1A", "chinese": "老師", "defEn": "a person who teaches children at school", "example": "My teacher is very nice." },
  { "word": "whose", "pos": "pron.", "group": "ESL 2A", "chinese": "誰的", "defEn": "used to ask who something belongs to", "example": "Whose bag is this?" },
  { "word": "hotel", "pos": "n.", "group": "ESL 2A", "chinese": "飯店旅館", "defEn": "a place where people can stay when they are away from home", "example": "We stay at a hotel." },
  { "word": "Spanish", "pos": "adj.", "group": "ESL 3A", "chinese": "西班牙文 / 西班牙人的", "defEn": "from Spain, or the language spoken in Spain", "example": "My new classmate is Spanish." },
  { "word": "important", "pos": "adj.", "group": "ESL 3A", "chinese": "重要的", "defEn": "you need to think about or do carefully", "example": "It is important to check your bag." },
  { "word": "land", "pos": "n.", "group": "ESL 4A", "chinese": "陸地 / 降落", "defEn": "the ground, not the sea; to come down to the ground", "example": "The plane landed safely." },
  { "word": "Europe", "pos": "n.", "group": "ESL 4A", "chinese": "歐洲", "defEn": "a continent that includes countries such as France and Spain", "example": "We want to travel to Europe." },
  { "word": "dinosaur", "pos": "n.", "group": "ESL 5A", "chinese": "恐龍", "defEn": "a large reptile that lived millions of years ago", "example": "We saw a dinosaur skeleton at the museum." },
  { "word": "textbook", "pos": "n.", "group": "ESL 6A", "chinese": "課本", "defEn": "a book used for studying a school subject", "example": "Our science textbook has many pictures." }
];

let wordDatabase = [];
let currentQuizIndex = 0;
let currentQuizAnswer = '';

// 初始化語音選單
function populateVoiceList() {
    if (typeof speechSynthesis === 'undefined') return;
    const voices = speechSynthesis.getVoices();
    const voiceSelect = document.getElementById('voiceSelect');
    voiceSelect.innerHTML = '';
    
    voices.forEach((voice) => {
        const option = document.createElement('option');
        option.textContent = `${voice.name} (${voice.lang})`;
        option.setAttribute('data-lang', voice.lang);
        option.setAttribute('data-name', voice.name);
        if (voice.lang.includes('en')) option.selected = true;
        voiceSelect.appendChild(option);
    });
}

populateVoiceList();
if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = populateVoiceList;
}

function speak(text) {
    if (typeof speechSynthesis === 'undefined') return;
    const utterance = new SpeechSynthesisUtterance(text);
    const voiceSelect = document.getElementById('voiceSelect');
    const selectedOption = voiceSelect.selectedOptions[0];
    if (selectedOption) {
        const voices = speechSynthesis.getVoices();
        utterance.voice = voices.find(v => v.name === selectedOption.getAttribute('data-name'));
    }
    speechSynthesis.speak(utterance);
}

// 載入資料庫（直接強制使用 defaultData）
function loadDatabase() {
    wordDatabase = defaultData;
    localStorage.setItem('esl_word_db', JSON.stringify(wordDatabase));
    if (document.getElementById('jsonInput')) {
        document.getElementById('jsonInput').value = JSON.stringify(wordDatabase, null, 2);
    }
}

function saveDatabase() {
    try {
        const input = document.getElementById('jsonInput').value;
        wordDatabase = JSON.parse(input);
        localStorage.setItem('esl_word_db', JSON.stringify(wordDatabase));
        alert('儲存成功！');
        initApp();
    } catch (e) {
        alert('JSON 格式錯誤，請檢查！');
    }
}

// 分頁切換
function switchTab(tabName) {
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    if (tabName === 'learn') {
        document.querySelectorAll('.nav-btn')[0].classList.add('active');
        document.getElementById('learnTab').classList.add('active');
    } else if (tabName === 'quiz') {
        document.querySelectorAll('.nav-btn')[1].classList.add('active');
        document.getElementById('quizTab').classList.add('active');
        initQuiz();
    } else if (tabName === 'settings') {
        document.getElementById('settingsTab').classList.add('active');
    }
}

// 下拉選單填充
function populateGroupFilter() {
    const select = document.getElementById('groupSelect');
    const groups = [...new Set(wordDatabase.map(item => item.group))].sort();
    select.innerHTML = '<option value="ALL">全部顯示</option>';
    groups.forEach(group => {
        const opt = document.createElement('option');
        opt.value = group;
        opt.textContent = group;
        select.appendChild(opt);
    });
}

function filterData() {
    renderCards();
}

// 渲染學習卡片
function renderCards() {
    const grid = document.getElementById('cardGrid');
    const selectedGroup = document.getElementById('groupSelect').value;
    grid.innerHTML = '';

    const filtered = selectedGroup === 'ALL' 
        ? wordDatabase 
        : wordDatabase.filter(item => item.group === selectedGroup);

    filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div>
                <div class="word-title">
                    <span>${item.word}</span>
                    <button class="audio-btn" onclick="speak('${item.word.replace(/'/g, "\\'")}')">🔊</button>
                </div>
                <div class="pos">${item.pos || ''}</div>
                <div class="chinese">${item.chinese}</div>
                <div class="def-en">${item.defEn || ''}</div>
            </div>
            <div class="example">${item.example || ''}</div>
        `;
        grid.appendChild(card);
    });
}

// 測驗功能
function initQuiz() {
    nextQuiz();
}

function nextQuiz() {
    document.getElementById('quizFeedback').textContent = '';
    const selectedGroup = document.getElementById('groupSelect').value;
    const pool = selectedGroup === 'ALL' 
        ? wordDatabase 
        : wordDatabase.filter(item => item.group === selectedGroup);

    if (pool.length === 0) {
        document.getElementById('quizQuestion').textContent = '該群組尚無資料';
        document.getElementById('quizOptions').innerHTML = '';
        return;
    }

    const current = pool[Math.floor(Math.random() * pool.length)];
    currentQuizAnswer = current.chinese;
    document.getElementById('quizQuestion').textContent = current.word;

    // 隨機選項
    let options = [current.chinese];
    while (options.length < 4 && options.length < pool.length) {
        const randomItem = pool[Math.floor(Math.random() * pool.length)];
        if (!options.includes(randomItem.chinese)) {
            options.push(randomItem.chinese);
        }
    }
    options.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('quizOptions');
    optionsContainer.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-opt-btn';
        btn.textContent = opt;
        btn.onclick = () => checkQuiz(opt);
        optionsContainer.appendChild(btn);
    });
}

function checkQuiz(selected) {
    const feedback = document.getElementById('quizFeedback');
    if (selected === currentQuizAnswer) {
        feedback.textContent = '🎉 正確！非常棒！';
        feedback.style.color = 'green';
    } else {
        feedback.textContent = `❌ 答錯囉！正確答案是：${currentQuizAnswer}`;
        feedback.style.color = 'red';
    }
}

// 主初始化程序
function initApp() {
    loadDatabase();
    populateGroupFilter();
    renderCards();
}

window.onload = initApp;
</script>
</body>
</html>
